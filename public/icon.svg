<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#FFF9EF" />
      <stop offset="0.6" stop-color="#F7EDDF" />
      <stop offset="1" stop-color="#EEDFCA" />
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E4EED9" stop-opacity="0.95" />
      <stop offset="1" stop-color="#E4EED9" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pot" x1="282" x2="742" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6B496" />
      <stop offset="0.45" stop-color="#D49B7C" />
      <stop offset="1" stop-color="#B8795B" />
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="0" y1="508" y2="604" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFC3A7" />
      <stop offset="1" stop-color="#CC8E70" />
    </linearGradient>
    <linearGradient id="shade" x1="0" x2="0" y1="596" y2="866" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A3426" stop-opacity="0.16" />
      <stop offset="0.14" stop-color="#4A3426" stop-opacity="0" />
      <stop offset="0.8" stop-color="#4A3426" stop-opacity="0" />
      <stop offset="1" stop-color="#4A3426" stop-opacity="0.14" />
    </linearGradient>
    <radialGradient id="soil" cx="0.45" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#8A6A53" />
      <stop offset="1" stop-color="#5E4433" />
    </radialGradient>
    <linearGradient id="stem" x1="0" x2="0" y1="540" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5F8A4F" />
      <stop offset="1" stop-color="#7DA56A" />
    </linearGradient>
    <radialGradient id="blush">
      <stop offset="0" stop-color="#F09A8A" stop-opacity="0.85" />
      <stop offset="1" stop-color="#F09A8A" stop-opacity="0" />
    </radialGradient>
    <clipPath id="body"><path d="M290 596 L734 596 L700 824 Q694 866 650 866 L374 866 Q330 866 324 824 Z" /></clipPath>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)" />
  <circle cx="512" cy="430" r="330" fill="url(#glow)" />

  <!-- ground shadow -->
  <ellipse cx="512" cy="880" rx="250" ry="26" fill="#5B4636" opacity="0.12" />

  <!-- pot body -->
  <path d="M290 596 L734 596 L700 824 Q694 866 650 866 L374 866 Q330 866 324 824 Z" fill="url(#pot)" />
  <g clip-path="url(#body)">
    <rect x="270" y="596" width="484" height="280" fill="url(#shade)" />
    <path d="M352 630 Q344 712 360 812" stroke="#fff" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.22" />
  </g>

  <!-- rim -->
  <rect x="256" y="508" width="512" height="96" rx="48" fill="url(#rim)" />
  <rect x="292" y="522" width="230" height="14" rx="7" fill="#fff" opacity="0.32" />

  <!-- soil -->
  <ellipse cx="512" cy="524" rx="224" ry="36" fill="#4E3829" opacity="0.6" />
  <ellipse cx="512" cy="527" rx="208" ry="28" fill="url(#soil)" />

  <!-- sprout -->
  <path d="M512 530 Q500 430 516 330" stroke="url(#stem)" stroke-width="22" stroke-linecap="round" fill="none" />
  <path d="M508 520 Q498 432 512 342" stroke="#C3DBAE" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.45" />
  <!-- left leaf -->
  <g transform="translate(514 352) rotate(-152)">
    <path d="M0 0 Q 100 -6 190 0 C 140 54 46 64 0 0 Z" fill="#7EA76B" />
    <path d="M0 0 C 46 -82 140 -80 190 0 Q 100 -6 0 0 Z" fill="#A6C78F" />
    <path d="M14 -2 Q 100 -10 172 -1" stroke="#D2E3C2" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85" />
  </g>
  <!-- right leaf -->
  <g transform="translate(516 334) rotate(-34)">
    <path d="M0 0 Q 110 -6 210 0 C 156 60 50 70 0 0 Z" fill="#7EA76B" />
    <path d="M0 0 C 50 -90 156 -88 210 0 Q 110 -6 0 0 Z" fill="#A6C78F" />
    <path d="M16 -2 Q 110 -10 190 -1" stroke="#D2E3C2" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- face -->
  <ellipse cx="384" cy="742" rx="48" ry="30" fill="url(#blush)" />
  <ellipse cx="640" cy="742" rx="48" ry="30" fill="url(#blush)" />
  <ellipse cx="440" cy="700" rx="27" ry="31" fill="#47352A" />
  <ellipse cx="584" cy="700" rx="27" ry="31" fill="#47352A" />
  <circle cx="450" cy="688" r="10.5" fill="#fff" />
  <circle cx="594" cy="688" r="10.5" fill="#fff" />
  <circle cx="431" cy="714" r="4.5" fill="#fff" opacity="0.8" />
  <circle cx="575" cy="714" r="4.5" fill="#fff" opacity="0.8" />
  <path d="M486 746 Q512 770 538 746" stroke="#47352A" stroke-width="11" stroke-linecap="round" fill="none" />
</svg>
